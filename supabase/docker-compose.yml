# Local migration validation against real Postgres (no Supabase needed).
#
#   cd supabase
#   docker compose up -d --wait      # first boot applies env + all migrations
#   docker compose down -v           # reset: wipes volume, re-applies on next up
#
# The container auto-applies, in order: local-test/20-supabase-env.sql
# (roles, auth.uid(), auth.users) and every supabase/migrations/*.sql.
# See local-test/example.tests.sql for how to test RLS/functions as a
# client role. This setup validates SQL semantics only — PostgREST/auth
# services are not part of it.
services:
  db:
    image: postgres:15
    container_name: zikr-local-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zikr_local
    ports:
      - "55433:5432"
    volumes:
      - zikr-pgdata:/var/lib/postgresql/data
      - ./local-test/10-init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - ./local-test/20-supabase-env.sql:/opt/local-test/20-supabase-env.sql:ro
      - ./migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zikr_local"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  zikr-pgdata:
